# Mirrors the schema path of application-prod.properties on H2 (PostgreSQL mode, own in-memory database):
# Flyway creates the schema from db/migration, Hibernate only validates the entities against it, no seed data.
spring.datasource.url=jdbc:h2:mem:flyway-validate;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.jpa.hibernate.ddl-auto=validate
spring.sql.init.mode=never
