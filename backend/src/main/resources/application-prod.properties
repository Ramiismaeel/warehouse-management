# Production: PostgreSQL on Neon, configured only via environment variables (no defaults).
# Flyway creates the schema (db/migration), Hibernate only validates it. No schema.sql, no seeds.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.h2.console.enabled=false
spring.flyway.enabled=true
spring.sql.init.mode=never
app.cors.allowed-origins=http://localhost:5173
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.connection-timeout=30000
# Render terminates HTTPS in front of the app: trust its X-Forwarded-* headers, so the request is https like the
# browser's Origin. Otherwise Spring sees a cross-origin request and rejects POST/PUT/DELETE with 403.
server.forward-headers-strategy=framework
